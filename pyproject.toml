[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-anakin"
version = "0.1.0"
description = "CrewAI tools for Anakin: web scraping, search, deep research, Wire site actions, monitors and browser tasks"
authors = [{name = "Anakin", email = "support@anakin.io"}]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "MIT"
keywords = ["crewai", "anakin", "web scraping", "agents", "tools", "crawl", "search"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "anakin-sdk>=0.2.0,<0.3",
    "crewai>=1.0,<2",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://anakin.io"
Documentation = "https://anakin.io/docs"
Repository = "https://github.com/Anakin-Inc/crewai-anakin"
Issues = "https://github.com/Anakin-Inc/crewai-anakin/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_anakin"]

[tool.mypy]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.isort]
known-third-party = ["anakin"]
